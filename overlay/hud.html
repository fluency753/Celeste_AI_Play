<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Celeste AI HUD</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 尺寸以卡片宽度为基准：设计稿按 1080p 下页面宽 350 px（游戏宽 1920 的约 18%）给出像素值，
     换算成视口宽度的比例，置顶窗口或 OBS 浏览器源放大缩小时整体等比缩放。
     版式：一个大数字（章节计时，左侧色条跟随 Madeline 的发色），其余信息安静地排在下面，思考语句字号最大。 */
  :root {
    --card: rgba(16, 19, 34, 0.80);
    --rule: rgba(255, 255, 255, 0.10);
    --text: #F3F5FA;
    --label: #8F9AB3;
    --warn: #F08A3C;
    --theme: #E0475B;
    --px: calc(100vw / 350);           /* 1 设计像素 */
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    font-family: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-shadow: 0 var(--px) calc(2 * var(--px)) rgba(0, 0, 0, 0.5);
  }
  /* 数字与英文档位：半窄体、等宽数字，数值变化时不抖动 */
  .num { font-family: "Barlow Semi Condensed", "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI", sans-serif;
         font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.01em; }
  .card {
    position: relative;
    margin: calc(4 * var(--px));
    padding: calc(13 * var(--px)) calc(16 * var(--px)) calc(14 * var(--px)) calc(21 * var(--px));
    background: var(--card);
    border: max(1px, var(--px)) solid var(--rule);
    border-radius: calc(12 * var(--px));
    box-shadow: 0 calc(3 * var(--px)) calc(12 * var(--px)) rgba(0, 0, 0, 0.32);
  }
  .card.hidden { visibility: hidden; }
  .bar-left {
    position: absolute; left: calc(8 * var(--px)); top: calc(14 * var(--px)); bottom: calc(14 * var(--px));
    width: calc(3 * var(--px)); border-radius: calc(2 * var(--px)); background: var(--theme);
    transition: background-color 120ms linear;
  }

  .head { display: flex; align-items: baseline; gap: calc(8 * var(--px)); font-size: calc(15 * var(--px)); line-height: 1.35; }
  .name { font-weight: 700; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: calc(5 * var(--px)); font-size: calc(13 * var(--px));
            color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { flex: none; width: calc(7 * var(--px)); height: calc(7 * var(--px)); border-radius: 50%; background: var(--label); }
  .dot.breathe { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .room { margin-left: auto; white-space: nowrap; font-weight: 700; }
  .room .rm { color: var(--label); font-weight: 500; margin-left: calc(4 * var(--px)); }

  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(10 * var(--px));
         margin: calc(4 * var(--px)) 0 calc(11 * var(--px)); }
  .timer { font-size: calc(36 * var(--px)); line-height: 1.05; white-space: nowrap; }
  .timer .ms { font-size: 0.62em; color: #C9D0DE; }
  .effort { text-align: right; white-space: nowrap; }
  .effort.hidden { display: none; }
  .effort .lbl { font-size: calc(12 * var(--px)); color: var(--label); line-height: 1.3; }
  .effort-val { display: flex; align-items: center; justify-content: flex-end; gap: calc(6 * var(--px));
                font-size: calc(18 * var(--px)); line-height: 1.2; }
  .meter { display: inline-flex; align-items: flex-end; gap: calc(2 * var(--px)); height: calc(12 * var(--px)); }
  .meter i { display: block; width: calc(3 * var(--px)); border-radius: calc(1 * var(--px));
             background: rgba(255, 255, 255, 0.16); transition: background-color 200ms linear; }
  .meter i:nth-child(1) { height: 36%; } .meter i:nth-child(2) { height: 52%; } .meter i:nth-child(3) { height: 68%; }
  .meter i:nth-child(4) { height: 84%; } .meter i:nth-child(5) { height: 100%; }
  .meter i.on { background: var(--effort, #7FA6F5); }
  #effort { color: var(--effort, #7FA6F5); }
  .pending { color: var(--pending, #F5B841); animation: breathe 1.6s ease-in-out infinite; }
  .pending:empty { display: none; }

  .rule { height: max(1px, var(--px)); background: var(--rule); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(22 * var(--px)); row-gap: calc(3 * var(--px));
           padding: calc(9 * var(--px)) 0; }
  .stat { display: flex; align-items: baseline; justify-content: space-between; gap: calc(8 * var(--px)); min-width: 0; }
  .stat .k { font-size: calc(13 * var(--px)); color: var(--label); white-space: nowrap; }
  .stat .v { font-size: calc(16 * var(--px)); white-space: nowrap; }
  .stat .v.warn { color: var(--warn); }
  .stat .v.dim { color: var(--label); }
  /* 调用工具：占满一行，放不下时省略 */
  .stat.wide { grid-column: 1 / -1; }
  .stat .v.call { font-size: calc(14 * var(--px)); min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .thought {
    margin-top: calc(10 * var(--px));
    font-size: calc(17 * var(--px)); line-height: 1.5; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .thought:empty { display: none; }
  /* 五行放不下时字号缩小一档、最多六行（页面高度不变） */
  .thought.small { font-size: calc(15 * var(--px)); -webkit-line-clamp: 6; }
  .thought.fade { animation: fadein 200ms ease-out; }
  /* 规划回放时思考语句下面的一行小字：第几轮、推演了多少条路线 */
  .meta { margin-top: calc(4 * var(--px)); font-size: calc(13 * var(--px)); color: var(--label); }
  .meta:empty { display: none; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .dot.breathe, .pending, .thought.fade { animation: none; }
  }
</style>
</head>
<body>
<div class="card hidden" id="card">
  <div class="bar-left" id="theme"></div>
  <div class="head">
    <span class="name" id="name">—</span>
    <span class="status"><span class="dot" id="dot"></span><span id="status">等待</span></span>
    <span class="room" id="room"></span>
  </div>
  <div class="top">
    <div class="timer num" id="timer">0:00:00<span class="ms">.000</span></div>
    <div class="effort hidden" id="effortBox">
      <div class="lbl">推理强度</div>
      <div class="effort-val num">
        <span class="meter" id="effortMeter"><i></i><i></i><i></i><i></i><i></i></span>
        <span id="effort"></span><span class="pending" id="effortPending"></span>
      </div>
    </div>
  </div>
  <div class="rule"></div>
  <div class="stats">
    <div class="stat"><span class="k">思考</span><span class="v num" id="thinking">0:00:00</span></div>
    <div class="stat"><span class="k">上下文</span><span class="v num" id="ctx">0</span></div>
    <div class="stat"><span class="k">工具</span><span class="v num" id="tool">0:00:00</span></div>
    <div class="stat"><span class="k">压缩</span><span class="v num" id="compact">0</span></div>
    <div class="stat"><span class="k">知识库读取</span><span class="v num" id="study">—</span></div>
    <div class="stat"><span class="k">死亡</span><span class="v num" id="deaths">0 次</span></div>
    <div class="stat"><span class="k">模拟器调用</span><span class="v num" id="simCalls">0 次</span></div>
    <div class="stat"><span class="k">推演路径</span><span class="v num" id="simRuns">0 条</span></div>
    <div class="stat"><span class="k">推演最速</span><span class="v num" id="simBest">—</span></div>
    <div class="stat wide"><span class="k">调用工具</span><span class="v call" id="toolCall">—</span></div>
  </div>
  <div class="rule"></div>
  <div class="thought" id="thought"></div>
  <div class="meta" id="meta"></div>
</div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
// 由 HUD 服务提供时用相对地址；作为本地文件打开（OBS 浏览器源的本地文件模式）时连默认端口——
// 这样 OBS 先于 HUD 服务启动也不要紧，服务起来后页面自动取到数据
const STATE_URL = params.get("state") ||
  (location.protocol.startsWith("http") && location.pathname.startsWith("/hud") ? "/hud/state" : "http://127.0.0.1:47790/hud/state");
const STATUS = {
  starting:  ["等待", "idle", false],
  studying:  ["读知识库", "studying", true],
  thinking:  ["思考中", "thinking", true],
  tool:      ["运行工具", "tool", true],
  compacting:["压缩上下文", "thinking", true],
  executing: ["执行中", "executing", false],
  auto:      ["自动推进", "idle", false],
  retrying:  ["自动重试", "retrying", false],
  replaying: ["规划回放", "replay", true],
  quota_wait:["等待额度重置", "idle", false],
  done:      ["已完成", "idle", false],
  stopped:   ["已结束", "idle", false],
};
// 推理强度：Claude Code 的五档，显示英文档位名（configs/hud.json 的 effort_names 可覆盖）
const EFFORT_LEVELS = ["low", "medium", "high", "xhigh", "max"];
let state = null, config = null, offset = 0, shownThought = null, lastThoughtCheck = 0;
const $ = (id) => document.getElementById(id);

function pad(n, w = 2) { return String(Math.floor(n)).padStart(w, "0"); }
function clock(sec) {
  sec = Math.max(0, sec);
  return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec / 60) % 60)}:${pad(Math.floor(sec) % 60)}`;
}
function hm(sec) {
  sec = Math.max(0, sec);
  return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec / 60) % 60)}`;
}
function tokens(n) {
  if (!n) return "0";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e4) return Math.round(n / 1000) + "k";
  return (n / 1000).toFixed(1) + "k";
}
function displayName(m) {
  const names = (config && config.names) || {};
  return names[m.agent] || names[m.model] || m.agent || "—";
}
function applyColors() {
  const c = (config && config.colors) || {};
  const root = document.documentElement.style;
  for (const [key, css] of [["card", "--card"], ["border", "--rule"], ["text", "--text"], ["label", "--label"],
                            ["warn", "--warn"]]) {
    if (c[key]) root.setProperty(css, c[key]);
  }
}

async function poll() {
  try {
    const t0 = Date.now() / 1000;
    const res = await fetch(STATE_URL, { cache: "no-store" });
    const data = await res.json();
    const t1 = Date.now() / 1000;
    offset = data.now - (t0 + t1) / 2;
    if (!config || JSON.stringify(config) !== JSON.stringify(data.config)) { config = data.config; applyColors(); }
    state = data.metrics || null;
  } catch (e) { /* 主控未启动时保持上一帧 */ }
}

function render() {
  const card = $("card");
  if (!state) { card.classList.add("hidden"); return; }
  card.classList.remove("hidden");
  const m = state, c = (config && config.colors) || {};
  const now = Date.now() / 1000 + offset;
  // 规划回放与智能体的思考同时进行（回放画上一轮，智能体在想下一轮）：回放期间状态栏显示"规划回放"
  const replaying = !!m.replaying || m.status === "replaying";
  const [text, kind, breathe] = replaying ? STATUS.replaying : (STATUS[m.status] || [m.status, "idle", false]);
  const playing = m.started_wall > 0;
  // 思考与工具时间从知识库读完就开始走（准备阶段的其余部分：写笔记、写程序、规划第一个房间）
  const counting = playing || (m.kb_progress != null && m.kb_progress >= 1);
  const ended = m.status === "done" || m.status === "stopped";

  $("name").textContent = displayName(m);
  let statusText = text;
  if (m.status === "studying") statusText = `${text} ${Math.round((m.kb_progress || 0) * 100)}%`;
  if (m.status === "quota_wait" && m.quota_wait_until) {
    const d = new Date(m.quota_wait_until * 1000);
    statusText = `${text}（${pad(d.getHours())}:${pad(d.getMinutes())} 恢复）`;
  }
  $("status").textContent = statusText;
  const dot = $("dot");
  dot.style.background = c[kind] || "#8F9AB3";
  dot.classList.toggle("breathe", breathe);

  const chapters = (config && config.chapters) || {};
  const ch = chapters[m.chapter] || (m.chapter || "").replace(/^Celeste\//, "");
  const room = $("room");
  room.textContent = ch;
  if (m.room) { const r = document.createElement("span"); r.className = "rm"; r.textContent = m.room; room.appendChild(r); }

  // 冲刺状态色：Madeline 的发色
  let theme = c.dash1 || "#E0475B";
  if (m.max_dashes > 0 && m.dashes === 0) theme = c.dash0 || "#5BC0EB";
  else if (m.dashes >= 2) theme = c.dash2 || "#F28AC4";
  $("theme").style.background = theme;

  // 主计时：游戏内计时。依次通关多章时是已通关各章与当前章之和（当前章已通关时不重复计入）。
  // 执行中两次进度推送之间按实时外推（最多 0.15 秒）
  const chapterDone = (m.splits || []).some(s => s.chapter === m.chapter);
  let game = ((m.completed_ticks || 0) + (chapterDone ? 0 : (m.chapter_time_ticks || 0))) / 1e7;
  if (!chapterDone && (m.status === "executing" || m.status === "auto") && m.chapter_time_wall > 0) {
    game += Math.min(0.15, Math.max(0, now - m.chapter_time_wall));
  }
  const timer = $("timer");
  timer.firstChild.nodeValue = clock(game);
  timer.lastChild.textContent = "." + pad(Math.floor((game * 1000) % 1000), 3);

  // 推理强度：当前生效的档位（英文）；申请了切换、还没生效时，后面跟一个呼吸闪烁的"→ 目标档位"
  const box = $("effortBox");
  const level = EFFORT_LEVELS.indexOf(m.effort);
  box.classList.toggle("hidden", level < 0);
  if (level >= 0) {
    const names = (config && config.effort_names) || {};
    $("effort").textContent = names[m.effort] || m.effort;
    const pending = m.effort_pending && m.effort_pending !== m.effort ? (names[m.effort_pending] || m.effort_pending) : "";
    $("effortPending").textContent = pending ? `→ ${pending}` : "";
    box.style.setProperty("--effort", level >= 3 ? (c.effort_high || "#F5B841") : (c.effort || "#7FA6F5"));
    box.style.setProperty("--pending", c.thinking || "#F5B841");
    $("effortMeter").querySelectorAll("i").forEach((el, i) => el.classList.toggle("on", i <= level));
  }

  let thinking = m.thinking_s || 0;
  if (counting && !ended && (m.status === "thinking" || m.status === "compacting") && m.thinking_since_wall > 0) {
    thinking += Math.max(0, now - m.thinking_since_wall);
  }
  $("thinking").textContent = clock(thinking);
  // 工具时间：容器里的 Bash、Read 等与游戏工具从调用到返回的时间（不含游戏推进）；运行工具时同样实时走表
  let tool = m.tool_s || 0;
  if (counting && !ended && m.status === "tool" && m.thinking_since_wall > 0) tool += Math.max(0, now - m.thinking_since_wall);
  if (m.status === "retrying" && m.phase_since_wall > 0) tool += Math.max(0, now - m.phase_since_wall);
  $("tool").textContent = clock(tool);

  // 知识库读取：开局到知识库读完的用时（读完后不再走）；跳过准备阶段（--no-study）时显示"—"
  let study = m.study_s || 0;
  if (m.status === "studying" && m.written_wall > 0) study += Math.max(0, now - m.written_wall);
  const studyEl = $("study");
  studyEl.textContent = study > 0 || m.status === "studying" ? clock(study) : "—";
  studyEl.classList.toggle("dim", !(study > 0 || m.status === "studying"));

  const ctx = m.context_tokens || 0;
  const limit = (config && config.compact_threshold) || 967000;
  $("ctx").textContent = tokens(ctx);
  $("ctx").classList.toggle("warn", ctx / limit >= 0.9);
  $("compact").textContent = String(m.compactions || 0);

  // 死亡次数
  $("deaths").textContent = `${m.deaths || 0} 次`;

  // 预置模拟器：调用次数（调用了模拟器的消息数）、当前这次调用推演的路线条数（这一轮回放画完清零）、
  // 当前房间里推演出的最快出房用时（换房间清零）
  $("simCalls").textContent = `${m.sim_calls || 0} 次`;
  const runs = m.sim_round_rollouts || 0;
  $("simRuns").textContent = (runs >= 10000 ? `${(runs / 10000).toFixed(runs >= 1e6 ? 0 : 1)}万` : runs.toLocaleString("en-US")) + " 条";
  const best = m.sim_best_frames || 0;
  $("simBest").textContent = best > 0 ? `${(best / 60).toFixed(3)}s` : "—";
  $("simBest").classList.toggle("dim", best <= 0);

  // 调用工具：智能体正在调用的工具与说明（Bash 用它写的 description，文件工具用路径）；没有在调用工具时显示"—"
  const call = (!ended && m.tool_call) || "";
  $("toolCall").textContent = call || "—";
  $("toolCall").classList.toggle("dim", !call);

  // 规划回放：思考语句的位置显示这一轮在试什么，下面一行小字是第几轮、推演了多少条路线（执行前画最终路线时写"即将执行"）
  $("meta").textContent = !replaying ? "" : m.replay_round > 0
    ? `第 ${m.replay_round} 轮规划 · 推演 ${(m.replay_runs || 0).toLocaleString("en-US")} 条路线` : "即将执行的路线";

  // 思考语句：一有新语句就淡入替换（thought_check_s 大于 0 时改为每隔几秒检查一次）。
  // 主控在每段动作开始推进之前会等 HUD 换好新语句，所以录像里新语句和这段动作的第一帧同时出现
  const interval = ((config && config.thought_check_s) || 0) * 1000;
  if (shownThought === null || interval <= 0 || Date.now() - lastThoughtCheck >= interval) {
    lastThoughtCheck = Date.now();
    const next = replaying ? (m.replay_label || "") : (m.thought || "");
    if (next !== shownThought) {
      shownThought = next;
      const el = $("thought");
      el.textContent = next;
      el.classList.remove("small");
      if (el.scrollHeight > el.clientHeight + 1) el.classList.add("small");
      el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
    }
  }
}

poll();
setInterval(poll, Number(params.get("poll") || 100));
(function loop() { render(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
