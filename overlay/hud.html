<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Celeste AI HUD</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 字号由独立设置决定；卡片占满当前窗口或 OBS 来源的内容区域。 */
  :root {
    --card: rgba(16, 19, 34, 0.80);
    --rule: rgba(255, 255, 255, 0.10);
    --text: #F3F5FA;
    --label: #8F9AB3;
    --warn: #F08A3C;
    --theme: #E0475B;
    --px: 1px;                       /* 字号独立于窗口尺寸 */
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  * { scrollbar-width:thin; scrollbar-color:#64718b transparent; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#64718b; border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover { background:#8291ad; }
  body {
    font-family: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-shadow: 0 var(--px) calc(2 * var(--px)) rgba(0, 0, 0, 0.5);
  }
  /* 数字与英文档位：半窄体、等宽数字，数值变化时不抖动 */
  .num { font-family: "Barlow Semi Condensed", "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI", sans-serif;
         font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0.01em; }
  .card {
    position: relative;
    display: flex; flex-direction: column; box-sizing: border-box;
    height: calc(var(--hud-height, 100vh) - 8 * var(--px));
    margin: calc(4 * var(--px));
    padding: calc(13 * var(--px)) calc(16 * var(--px)) calc(14 * var(--px)) calc(21 * var(--px));
    background: var(--card);
    border: max(1px, var(--px)) solid var(--rule);
    border-radius: calc(12 * var(--px));
    box-shadow: 0 calc(3 * var(--px)) calc(12 * var(--px)) rgba(0, 0, 0, 0.32);
  }
  .card.hidden { visibility: hidden; }
  .card > * { flex-shrink: 0; }
  .bar-left {
    position: absolute; left: calc(8 * var(--px)); top: calc(14 * var(--px)); bottom: calc(14 * var(--px));
    width: calc(3 * var(--px)); border-radius: calc(2 * var(--px)); background: var(--theme);
    transition: background-color 120ms linear;
  }

  .head { display: flex; align-items: baseline; gap: calc(8 * var(--px)); font-size: calc(15 * var(--px)); line-height: 1.35; }
  .name { font-weight: 700; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: calc(5 * var(--px)); font-size: calc(13 * var(--px));
            color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { flex: none; width: calc(7 * var(--px)); height: calc(7 * var(--px)); border-radius: 50%; background: var(--label); }
  .dot.breathe { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .room { margin-left: auto; white-space: nowrap; font-weight: 700; }
  .room .rm { color: var(--label); font-weight: 500; margin-left: calc(4 * var(--px)); }

  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(10 * var(--px));
         margin: calc(4 * var(--px)) 0 calc(11 * var(--px)); }
  .timer { font-size: calc(36 * var(--px)); line-height: 1.05; white-space: nowrap; }
  .timer .ms { font-size: 0.62em; color: #C9D0DE; }
  .effort { text-align: right; white-space: nowrap; }
  .effort.hidden { display: none; }
  .stat.hidden { display: none; }   /* 没有数据的行（数据来源、推演额度等）不显示 */
  .effort .lbl { font-size: calc(12 * var(--px)); color: var(--label); line-height: 1.3; }
  .effort-val { display: flex; align-items: center; justify-content: flex-end; gap: calc(6 * var(--px));
                font-size: calc(18 * var(--px)); line-height: 1.2; }
  .meter { display: inline-flex; align-items: flex-end; gap: calc(2 * var(--px)); height: calc(12 * var(--px)); }
  .meter i { display: block; width: calc(3 * var(--px)); border-radius: calc(1 * var(--px));
             background: rgba(255, 255, 255, 0.16); transition: background-color 200ms linear; }
  .meter i.on { background: var(--effort, #7FA6F5); }
  #effort { color: var(--effort, #7FA6F5); }
  .pending { color: var(--pending, #F5B841); animation: breathe 1.6s ease-in-out infinite; }
  .pending:empty { display: none; }

  .rule { height: max(1px, var(--px)); background: var(--rule); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(22 * var(--px)); row-gap: calc(3 * var(--px));
           padding: calc(9 * var(--px)) 0; }
  .stat { display: flex; align-items: baseline; justify-content: space-between; gap: calc(8 * var(--px)); min-width: 0; }
  .stat .k { font-size: calc(13 * var(--px)); color: var(--label); white-space: nowrap; }
  .stat .v { font-size: calc(16 * var(--px)); white-space: nowrap; }
  .stat .v.warn { color: var(--warn); }
  .stat .v.dim { color: var(--label); }
  /* 调用工具：占满一行，放不下时折行，最多三行（再长才省略） */
  .stat.wide { grid-column: 1 / -1; }
  .stat .v.call { font-size: calc(14 * var(--px)); line-height: 1.35; min-width: 0; flex: 1 1 auto; text-align: right;
                  white-space: normal; overflow-wrap: anywhere;
                  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  /* 折成多行时左对齐，读起来顺 */
  .stat .v.call.multi { text-align: left; }

  .thought {
    margin-top: calc(10 * var(--px));
    font-size: calc(15 * var(--px)); line-height: 1.5; font-weight: 500;
    flex: 1 1 0; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; scroll-behavior: auto;
    overflow-wrap: anywhere;
  }
  .thought-entry { padding: calc(9 * var(--px)) calc(10 * var(--px)); margin: calc(7 * var(--px)) calc(3 * var(--px)) calc(7 * var(--px)) 0;
    background: rgba(150, 173, 225, 0.10); border: 1px solid var(--rule); border-radius: calc(9 * var(--px)); white-space: pre-wrap; animation: none; transition: none; }
  .thought-entry:last-child { background: rgba(127, 166, 245, 0.18); }
  .thought-entry .tag { display: block; color: var(--label); font-size: calc(11 * var(--px)); font-weight: 400; }
  .thought.hidden { display:none; }
  .history-tabs { display:flex; gap:calc(5 * var(--px)); margin-top:calc(6 * var(--px)); }
  .history-tabs button { cursor:pointer; font:inherit; font-size:calc(12 * var(--px)); color:var(--label); background:transparent; border:1px solid var(--rule); border-radius:5px; padding:calc(3 * var(--px)) calc(8 * var(--px)); }
  .history-tabs button[aria-selected="true"] { color:var(--text); background:rgba(127,166,245,.18); }
  .obs-surface .history-tabs, .obs-surface #toolActivity { display:none !important; }
  .tool-entry { margin:calc(5 * var(--px)) 0; border:1px solid var(--rule); border-radius:6px; background:rgba(150,173,225,.08); }
  .tool-entry summary { cursor:pointer; padding:calc(6 * var(--px)); font-size:calc(12 * var(--px)); }
  .tool-entry .tool-meta, #toolNotice { color:var(--label); font-size:calc(11 * var(--px)); }
  .tool-entry[data-status="failed"] .tool-meta { color:#ff9c91; }
  .tool-entry[data-status="running"] .tool-meta { color:#9fc5ff; }
  .tool-entry pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:calc(6 * var(--px)); font:inherit; font-size:calc(11 * var(--px)); }
  .hud-desktop .head { cursor: move; user-select: none; }
  .window-bar { display:none; }
  .hud-desktop .window-bar { display:flex; align-items:center; gap:calc(5 * var(--px)); margin-bottom:calc(5 * var(--px)); cursor:move; user-select:none; }
  .window-bar .caption { flex:1; color:var(--label); font-size:calc(11 * var(--px)); }
  .window-bar button { color:var(--label); background:transparent; border:1px solid transparent; border-radius:4px; padding:calc(2 * var(--px)) calc(5 * var(--px)); font:inherit; font-size:calc(12 * var(--px)); cursor:pointer; }
  .window-bar button:hover { background:rgba(150,173,225,.18); color:var(--text); }
  .window-bar button[aria-pressed="true"] { color:#a9caff; background:rgba(91,145,230,.2); }
  #windowClose:hover { background:#b83b4d; color:white; }
  .thought-entry.from-user { background: rgba(91,145,230,.24); }
  .thought-entry.system { font-size:calc(12 * var(--px)); color:#d8c395; text-align:center; background:rgba(190,153,82,.1); }
  #agentControls { margin-top: calc(8 * var(--px)); padding-top: calc(8 * var(--px)); border-top: 1px solid var(--rule);
    max-height:48vh; min-height:0; flex-shrink:1; overflow-y:auto; overscroll-behavior:contain; }
  .obs-surface #agentControls { display: none; }
  .obs-surface body { width: 100vw; height: 100vh; }
  #agentInput { box-sizing: border-box; width: 100%; height: calc(54 * var(--px)); resize: none; padding: calc(7 * var(--px)); border: 1px solid #52678e; border-radius: 6px; background: #1b2436; color: var(--text); font: inherit; font-size: calc(13 * var(--px)); }
  #agentControls > .control-buttons select { min-width:0; color:var(--text); background:#1b2436; border:1px solid #52678e; border-radius:4px; font:inherit; font-size:calc(12 * var(--px)); padding:calc(3 * var(--px)); }
  #sessionSelect { box-sizing:border-box; width:100%; margin-bottom:calc(6 * var(--px)); padding:calc(4 * var(--px)); border:1px solid #52678e; border-radius:5px; background:#1b2436; color:var(--text); font:inherit; font-size:calc(12 * var(--px)); }
  #agentControls > details { font-size:calc(12 * var(--px)); margin-bottom:calc(6 * var(--px)); }
  #agentControls > details > summary { font-size:inherit; cursor:pointer; color:var(--label); padding:calc(3 * var(--px)) 0; }
  #sessionPanel input, #sessionPanel select, #recordingPanel select { box-sizing:border-box; min-width:0; max-width:100%; font:inherit; color:var(--text); background:#1b2436; border:1px solid #52678e; border-radius:4px; padding:calc(4 * var(--px)); }
  #recordingPanel label { display:block; margin:calc(4 * var(--px)) 0; }
  #recordingStatus { color:var(--label); font-size:calc(11 * var(--px)); }
  #sessionName { width:100%; margin-top:calc(4 * var(--px)); }
  #sessionModel { flex:1; width:0; }
  #modelChoiceStatus { font-size:calc(11 * var(--px)); color:var(--warn); overflow-wrap:anywhere; }
  #sessionOperation { color:var(--label); overflow-wrap:anywhere; white-space:pre-wrap; }
  #goalPanel { max-height:38vh; overflow:auto; }
  #goalText { box-sizing:border-box; width:100%; height:calc(45 * var(--px)); resize:vertical; font:inherit; color:var(--text); background:#1b2436; border:1px solid #52678e; border-radius:5px; }
  #goalPanel select, #goalPanel input { min-width:0; font:inherit; color:var(--text); background:#1b2436; border:1px solid #52678e; border-radius:4px; padding:calc(3 * var(--px)); }
  .goal-row { display:flex; gap:calc(3 * var(--px)); margin-top:calc(4 * var(--px)); }
  .goal-row select { flex:1; } .goal-row input { width:calc(60 * var(--px)); }
  #goalStatus { color:var(--label); font-size:calc(11 * var(--px)); margin-top:calc(5 * var(--px)); white-space:pre-wrap; }
  #goalStop { border-color:#ae665d; }
  #simFields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:calc(5 * var(--px)); }
  .sim-field { display:flex; flex-direction:column; gap:calc(2 * var(--px)); min-width:0; }
  .sim-field input { box-sizing:border-box; width:100%; min-width:0; font:inherit; color:var(--text); background:#1b2436; border:1px solid #52678e; border-radius:4px; padding:calc(4 * var(--px)); }
  #simStatus, #simCurrent { color:var(--label); font-size:calc(11 * var(--px)); margin:calc(5 * var(--px)) 0; }
  .control-buttons { display:flex; align-items:center; gap:calc(5 * var(--px)); margin-top:calc(5 * var(--px)); }
  .control-buttons button { font:inherit; font-size:calc(12 * var(--px)); border:1px solid #52678e; border-radius:5px; color:#dce8ff; background:#263652; padding:calc(4 * var(--px)) calc(8 * var(--px)); cursor:pointer; }
  .control-buttons button:disabled { opacity:.4; cursor:default; }
  #agentSend { margin-left:auto; }
  #controlStatus { font-size:calc(11 * var(--px)); color:var(--label); margin-top:calc(3 * var(--px)); }
  .resize-handle { display: none; position: fixed; z-index: 100; }
  .hud-desktop .resize-handle { display: block; background: rgba(127, 166, 245, 0.02); }
  .hud-desktop .resize-handle:hover { background: rgba(127, 166, 245, 0.3); }
  [data-resize="n"], [data-resize="s"] { left: 12px; right: 12px; height: 7px; cursor: ns-resize; }
  [data-resize="n"] { top: 0; } [data-resize="s"] { bottom: 0; }
  [data-resize="w"], [data-resize="e"] { top: 12px; bottom: 12px; width: 7px; cursor: ew-resize; }
  [data-resize="w"] { left: 0; } [data-resize="e"] { right: 0; }
  [data-resize="nw"], [data-resize="ne"], [data-resize="sw"], [data-resize="se"] { width: 13px; height: 13px; }
  [data-resize="nw"] { top: 0; left: 0; cursor: nwse-resize; }
  [data-resize="ne"] { top: 0; right: 0; cursor: nesw-resize; }
  [data-resize="sw"] { bottom: 0; left: 0; cursor: nesw-resize; }
  [data-resize="se"] { bottom: 0; right: 0; cursor: nwse-resize; }
  .thought:empty { display: none; }
  /* 规划回放时思考语句下面的一行小字：第几轮、推演了多少条路线 */
  .meta { margin-top: calc(4 * var(--px)); font-size: calc(13 * var(--px)); color: var(--label);
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta:empty { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .dot.breathe, .pending { animation: none; }
  }
</style>
</head>
<body>
<div class="card hidden" id="card">
  <div class="window-bar"><span class="caption">HUD</span><button id="windowPin" type="button" aria-label="切换窗口置顶" aria-pressed="true" title="取消置顶">置顶</button><button id="windowMinimize" type="button" aria-label="最小化到托盘" title="最小化到托盘；双击右下角红色 AI 图标恢复">−</button><button id="windowClose" type="button" aria-label="隐藏到托盘" title="隐藏到托盘；双击红色 AI 图标重新打开">×</button></div>
  <div class="bar-left" id="theme"></div>
  <div class="head">
    <span class="name" id="name">—</span>
    <span class="status"><span class="dot" id="dot"></span><span id="status">等待</span></span>
    <span class="room" id="room"></span>
  </div>
  <div class="top">
    <div class="timer num" id="timer">0:00:00<span class="ms">.000</span></div>
    <div class="effort hidden" id="effortBox">
      <div class="lbl">推理强度</div>
      <div class="effort-val num">
        <span class="meter" id="effortMeter"></span>
        <span id="effort"></span><span class="pending" id="effortPending"></span>
      </div>
    </div>
  </div>
  <div class="rule"></div>
  <div class="stats">
    <div class="stat"><span class="k">思考</span><span class="v num" id="thinking">0:00:00</span></div>
    <div class="stat"><span class="k">上下文</span><span class="v num" id="ctx">0</span></div>
    <div class="stat"><span class="k">工具</span><span class="v num" id="tool">0:00:00</span></div>
    <div class="stat"><span class="k">压缩</span><span class="v num" id="compact">0</span></div>
    <div class="stat hidden" id="chatSourceBox"><span class="k">数据来源</span><span class="v" id="chatSource">—</span></div>
    <div class="stat hidden" id="chatCallsBox"><span class="k" id="toolCountLabel">聊天工具调用</span><span class="v num" id="chatCalls">—</span></div>
    <div class="stat"><span class="k">知识库读取</span><span class="v num" id="study">—</span></div>
    <div class="stat"><span class="k">死亡</span><span class="v num" id="deaths">0 次</span></div>
    <div class="stat" id="simCallsBox"><span class="k">模拟器调用</span><span class="v num" id="simCalls">0 次</span></div>
    <div class="stat" id="simRunsBox"><span class="k">累计推演</span><span class="v num" id="simRuns">0 条</span></div>
    <div class="stat" id="simBestBox"><span class="k">推演最速</span><span class="v num" id="simBest">—</span></div>
    <div class="stat wide hidden" id="simEnergyBox"><span class="k">推演额度</span><span class="v num" id="simEnergy">—</span></div>
    <div class="stat wide"><span class="k">调用工具</span><span class="v call" id="toolCall">—</span></div>
  </div>
  <div class="rule"></div>
  <div class="history-tabs" role="tablist" aria-label="历史记录类型"><button id="showMessages" type="button" role="tab" aria-selected="true" aria-controls="thought">对话</button><button id="showTools" type="button" role="tab" aria-selected="false" aria-controls="toolActivity">工具记录</button></div>
  <div class="thought" id="thought" tabindex="0" role="tabpanel" aria-label="公开解说历史，可滚动查看"></div>
  <div class="thought hidden" id="toolActivity" tabindex="0" role="tabpanel" aria-label="实际工具调用记录"><div id="toolNotice">选择工具记录后读取…</div><div id="toolRows"></div></div>
  <div class="meta" id="meta"></div>
  <!-- novalidate：面板里的数字框（动作帧数、推演、目标等）各自在“应用”时校验，不能拦住聊天发送 -->
  <form id="agentControls" novalidate>
    <select id="sessionSelect" aria-label="独立 agent 会话" title="选择本项目的 agent 会话；试玩结束后可切换聊天" disabled><option>正在读取会话…</option></select>
    <details id="sessionPanel">
      <summary>会话管理</summary>
      <select id="sessionRuntime" aria-label="新会话执行器与提供方"><option value="codex:codex">Codex</option></select>
      <input id="sessionName" aria-label="新会话名称" placeholder="新会话名称（可选）" maxlength="60">
      <div class="control-buttons"><select id="sessionModel" aria-label="新会话模型" disabled><option value="">正在读取模型…</option></select><button id="sessionModelRefresh" type="button" title="重新读取所选执行器的模型列表">刷新</button></div>
      <div id="modelChoiceStatus" role="status"></div>
      <div class="control-buttons"><label>推理 <select id="sessionEffort" disabled><option value="">读取中…</option></select></label><button id="sessionNew" type="button" title="新建独立会话并准备入门资料，完成后可聊天或开始试玩">新建并准备</button><button id="sessionDisconnect" type="button">断开会话</button></div>
      <select id="sessionSave" aria-label="选择游戏存档"><option value="">选择存档…</option><option value="new">新建独立存档</option></select>
      <input id="sessionSaveName" aria-label="新存档名" placeholder="ASCII 玩家名（留空由 agent 取名）" maxlength="20" hidden>
      <div id="sessionSaveStatus" role="status" hidden></div>
      <div class="control-buttons"><label>起始A面 <input id="sessionChapter" type="number" min="0" max="10" value="0" style="width:3.5em"></label><select id="sessionScope" aria-label="试玩范围"><option value="campaign">顺序游玩</option><option value="chapter">仅这一章</option><option value="visited">已到访地图自由探索</option></select><select id="sessionCompletion" aria-label="通关后行为"><option value="stop">计划通关后停止</option><option value="continue">计划通关后继续</option></select><button id="sessionPlay" type="button" title="进入所选存档和章节后保持暂停，点击继续才开始操作">开始试玩</button></div>
      <label><input id="sessionSimAssist" type="checkbox" disabled>有限模拟辅助<span id="simAvailability">（检查安装状态…）</span></label>
      <div id="sessionOperation" role="status" hidden></div>
    </details>
    <details id="recordingPanel">
      <summary>录像与冻结</summary>
      <label>录像组织 <select id="recordingMode" aria-label="录像组织" disabled><option value="chapter">每章独立视频（不录选章）</option><option value="continuous">连续录制（跨章收集）</option></select></label>
      <label><input id="freezeChapterSelect" type="checkbox" checked disabled>冻结选章界面</label>
      <label><input id="freezeFileSelect" type="checkbox" disabled>冻结选档界面</label>
      <label><input id="freezeMainMenu" type="checkbox" disabled>冻结主菜单</label>
      <div id="recordingStatus" role="status">正在读取录像设置…</div>
    </details>
    <details id="goalPanel">
      <summary>目标与停止条件</summary>
      <textarea id="goalText" aria-label="任务目标" placeholder="自由填写任务，例如探索支路、尝试收集眼前的草莓" maxlength="4000"></textarea>
      <div class="control-buttons"><span>自动停止：</span><select id="goalMatch" aria-label="条件组合"><option value="all">满足全部条件</option><option value="any">满足任一条件</option></select><button id="goalAdd" type="button">＋条件</button></div>
      <div id="goalConditions"></div>
      <div class="goal-time-note" style="color:var(--label);font-size:calc(11 * var(--px))">时长单位为秒。“再增加至少”从本次更新起算。游戏时长只计实际推进，不含规划回放；现实时长包含思考及工具运行，不计准备、暂停及额度／网络等待。</div>
      <div class="control-buttons"><button id="goalSave" type="button" title="应用当前编辑；重复更新会重新记录停止条件的比较基线">更新</button><button id="goalClear" type="button">清除</button><button id="goalStop" type="button" title="取消正在执行的动作，结束试玩并保存录像">立即停止并保存</button></div>
      <div id="goalDraftStatus" role="status" hidden style="color:#b8822d;font-size:calc(11 * var(--px));margin-top:calc(5 * var(--px))"></div>
      <div id="goalStatus" role="status"></div>
    </details>
    <details id="actLimitPanel">
      <summary>动作帧数</summary>
      <label class="sim-field">单次 act 最多推进（帧）<input id="actLimitFrames" type="number" step="1" required aria-label="单次动作最大帧数"></label>
      <div class="control-buttons"><button id="actLimitSave" type="button">应用</button><button id="actLimitReset" type="button">撤销编辑</button></div>
      <div id="actLimitStatus" role="status"></div>
    </details>
    <details id="buttonPromptsPanel">
      <summary>按钮提示词</summary>
      <div class="control-buttons"><button id="buttonPromptsOpen" type="button">配置默认消息</button></div>
      <div>在控制台编辑本机默认正文；实际控制行为和状态由主控决定。</div>
    </details>
    <details id="simPanel">
      <summary>推演设置</summary>
      <div id="simCurrent"></div>
      <label class="sim-field">调整当前额度（留空保留现有余额）<input id="simBalance" type="number" min="0" step="1" aria-label="调整当前推演额度"></label>
      <div id="simFields"></div>
      <div class="control-buttons"><button id="simApply" type="button">应用修改</button><button id="simReset" type="button">撤销未提交修改</button></div>
      <div id="simStatus" role="status">正在读取推演设置…</div>
    </details>
    <textarea id="agentInput" aria-label="给独立 agent 的提示" placeholder="给 agent 发提示… Enter 发送，Shift+Enter 换行" maxlength="4000"></textarea>
    <div class="control-buttons" style="flex-wrap:wrap"><button id="togglePlay" type="button" disabled>暂停</button><button id="toggleFast" type="button" aria-pressed="false" title="切换独立 agent 的 Fast 模式，下一轮生效" disabled>Fast：—</button><select id="liveEffort" aria-label="当前会话推理强度" title="手动固定推理强度，下一轮生效；自动表示由 agent 调整" disabled><option value="auto">推理：自动</option></select><select id="cutsceneMode" aria-label="剧情处理模式" title="可在开始前和游玩中切换；agent决定时自行观看、推进、选择或跳过" disabled><option value="auto">剧情：自动跳过</option><option value="agent">剧情：agent决定</option></select><select id="permissionRestartChapter" aria-label="重启章节权限" disabled><option value="deny">重启章节：禁止</option><option value="allow">重启章节：允许</option></select><select id="permissionReturnToMap" aria-label="返回地图权限" disabled><option value="deny">返回地图：禁止</option><option value="allow">返回地图：允许</option></select><select id="permissionSaveQuit" aria-label="保存退出权限" disabled><option value="deny">保存退出：禁止</option><option value="allow">保存退出：允许</option></select><select id="permissionDetour" aria-label="计划外地图许可" title="允许 agent 自行返回地图去其他已解锁的官方章节、面与检查点，计划不变；开启时一并允许返回地图" disabled><option value="deny">计划外地图：禁止</option><option value="allow">计划外地图：允许</option></select><button id="agentSend" type="submit" disabled>发送</button></div>
    <div id="controlStatus" role="status">正在连接主控…</div>
  </form>
</div>
<div class="resize-handle" data-resize="n"></div><div class="resize-handle" data-resize="s"></div>
<div class="resize-handle" data-resize="w"></div><div class="resize-handle" data-resize="e"></div>
<div class="resize-handle" data-resize="nw"></div><div class="resize-handle" data-resize="ne"></div>
<div class="resize-handle" data-resize="sw"></div><div class="resize-handle" data-resize="se"></div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const PAGE_VERSION = 70;   // 与 configs/hud.json 的 page_version 一致（calibration/mod_hud_test.py 检查）
const OBS_SURFACE = params.get('surface') === 'obs';
document.documentElement.classList.toggle('obs-surface', OBS_SURFACE);
// 由 HUD 服务提供时用相对地址；作为本地文件打开（OBS 浏览器源的本地文件模式）时连默认端口——
// 这样 OBS 先于 HUD 服务启动也不要紧，服务起来后页面自动取到数据
const STATE_URL = params.get("state") ||
  (location.protocol.startsWith("http") && location.pathname.startsWith("/hud") ? "/hud/state" : "http://127.0.0.1:47790/hud/state");
const STATUS = {
  starting:  ["等待", "idle", false],
  paused:    ["用户暂停", "idle", false],
  chat_idle: ["等待聊天", "idle", false],
  studying:  ["读知识库", "studying", true],
  thinking:  ["思考中", "thinking", true],
  tool:      ["运行工具", "tool", true],
  compacting:["压缩上下文", "thinking", true],
  executing: ["执行中", "executing", false],
  auto:      ["自动推进", "idle", false],
  retrying:  ["自动重试", "retrying", false],
  replaying: ["规划回放", "replay", true],
  quota_wait:["等待额度重置", "idle", false],
  net_wait:  ["网络中断，等待恢复", "retrying", false],
  done:      ["已完成", "idle", false],
  stopped:   ["已结束", "idle", false],
};
// 推理强度：显示执行器实际确认的档位，显示英文档位名（configs/hud.json 的 effort_names 可覆盖）
let state = null, config = null, offset = 0;
let historyRun = null, historySignature = "", historyReady = false, followHistory = true;
let historyEndpoint = null;
const $ = (id) => document.getElementById(id);
document.querySelectorAll('.head,.window-bar').forEach(region=>region.addEventListener('pointerdown', (event) => {
  if (event.target.closest('button') || !document.documentElement.classList.contains('hud-desktop')) return;
  event.preventDefault(); window.pywebview?.api.drag_region('move');
}));
window.addEventListener('hud-window-state', event=>{
  const pinned=!!event.detail.topmost;
  $('windowPin').setAttribute('aria-pressed',String(pinned));
  $('windowPin').title=pinned?'取消置顶':'将 HUD 保持在最前';
});
for (const [id,action] of [['windowPin','pin'],['windowMinimize','minimize'],['windowClose','close']]) {
  $(id).onclick=()=>window.pywebview?.api.window_action(action);
}
for (const handle of document.querySelectorAll('[data-resize]')) {
  handle.addEventListener('pointerdown', (event) => {
    event.preventDefault(); window.pywebview?.api.drag_region(handle.dataset.resize);
  });
}
let fontWheelAt = 0;
window.addEventListener('wheel', (event) => {
  if (!event.ctrlKey || !document.documentElement.classList.contains('hud-desktop')) return;
  event.preventDefault();
  if (performance.now() - fontWheelAt < 70 || !event.deltaY) return;
  fontWheelAt = performance.now();
  window.pywebview?.api.change_font(event.deltaY < 0 ? 1 : -1).then(scale => {
    if (scale && config) { config.font_scale = scale; applyTypography(); }
  });
}, {passive: false});

function pad(n, w = 2) { return String(Math.floor(n)).padStart(w, "0"); }
function clock(sec) {
  sec = Math.max(0, sec);
  return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec / 60) % 60)}:${pad(Math.floor(sec) % 60)}`;
}
function hm(sec) {
  sec = Math.max(0, sec);
  return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec / 60) % 60)}`;
}
function tokens(n) {
  if (!n) return "0";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e4) return Math.round(n / 1000) + "k";
  return (n / 1000).toFixed(1) + "k";
}
function telemetryLabel(m) {
  return ({codex_app_server:'独立 Codex',claude_stream_json:'独立 Claude'})[m.telemetry_source] || '';
}
// Claude Code 启动时报告完整模型 ID（如 claude-opus-5-5、deepseek-flash[1m]）：去掉上下文后缀、claude- 前缀与版本号再查显示名
function modelKey(value) {
  return String(value || "").replace(/\[[^\]]*\]$/, "").replace(/^claude-/, "").replace(/(-\d+)+$/, "");
}
function displayName(m) {
  const names = (config && config.names) || {};
  const named = names[m.model] || names[modelKey(m.model)];
  if (telemetryLabel(m)) return named || m.model || '—';
  return named || names[m.agent] || m.model || m.agent || '—';
}
function applyColors() {
  const c = (config && config.colors) || {};
  const root = document.documentElement.style;
  for (const [key, css] of [["card", "--card"], ["border", "--rule"], ["text", "--text"], ["label", "--label"],
                            ["warn", "--warn"]]) {
    if (c[key]) root.setProperty(css, c[key]);
  }
}

function applyObsLayout() {
  applyTypography();
}
function applyTypography() {
  const scale = (config && config.font_scale) || 1;
  const mapping = OBS_SURFACE ? 1 : 1 / (devicePixelRatio || 1);
  document.body.style.setProperty('--px', `${scale * mapping}px`);
}
window.addEventListener('resize', applyObsLayout);

// 页面版本对不上时刷新一次换成新页面；刷新后版本仍不一致（页面与配置没有同步更新）时，一分钟内不再刷新，免得一直闪
function reloadAllowed() {
  if (goalDirty || savingGoal || goalPending) return false;
  try {
    const last = Number(sessionStorage.getItem("hudReloadAt") || 0);
    if (Date.now() - last < 60000) return false;
    sessionStorage.setItem("hudReloadAt", String(Date.now()));
  } catch (e) { /* 存储不可用时照常刷新 */ }
  return true;
}

// 各项统计按一局算：累计值 − 这一局开始时的值（chapter_base；没有时就是累计值），换图、换章、绕行都不清零
function since(m, key) { return Math.max(0, (m[key] || 0) - (((m.chapter_base || {})[key]) || 0)); }
function levelSeconds(m, now) {
  const clock = m.game_clock;
  const moving = (m.status === "executing" || m.status === "auto");
  if (clock && typeof clock === "object") {
    let seconds = (clock.frames || 0) / 60;
    if (moving && clock.level !== false && clock.wall > 0) seconds += Math.min(0.15, Math.max(0, now - clock.wall));   // 只在关卡里外推
    return seconds;
  }
  const chapterDone = m.piece_done != null ? !!m.piece_done : (m.splits || []).some(s => s.chapter === m.chapter);
  let game = m.chapter_base ? (m.chapter_time_ticks || 0) / 1e7 : ((m.completed_ticks || 0) + (chapterDone ? 0 : (m.chapter_time_ticks || 0))) / 1e7;
  if (!chapterDone && moving && m.chapter_time_wall > 0) game += Math.min(0.15, Math.max(0, now - m.chapter_time_wall));
  return game;
}

async function poll() {
  try {
    const t0 = Date.now() / 1000;
    const res = await fetch(STATE_URL, { cache: "no-store" });
    const data = await res.json();
    if (data.config && data.config.page_version && data.config.page_version !== PAGE_VERSION && reloadAllowed()) {
      location.reload(); return;
    }
    const t1 = Date.now() / 1000;
    offset = data.now - (t0 + t1) / 2;
    if (!config || JSON.stringify(config) !== JSON.stringify(data.config)) { config = data.config; applyColors(); applyObsLayout(); }
    // 切换会话或数据暂时不可用时保留上次画面，避免整个卡片闪空。
    if (data.metrics) state = data.metrics;
    // 新的思考语句一出现就取一次历史（不等 0.75 秒一次的轮询）：动作开始前只等 thought_lead_s（默认 0.4 秒）
    const thoughtKey = state ? JSON.stringify([state.thought, state.thought_updated_wall]) : null;
    if (thoughtKey !== lastThoughtKey) { lastThoughtKey = thoughtKey; pollHistory(); }
  } catch (e) { /* 主控未启动时保持上一帧 */ }
}
let lastThoughtKey = null, historyInflight = false;

function thoughtEntry(item) {
  const entry = document.createElement("div");
  entry.className = "thought-entry"; entry.dataset.id = item.id;
  entry.dataset.signature = JSON.stringify(item);
  entry.classList.toggle('from-user', item.role === 'user');
  entry.classList.toggle('system', item.role === 'system');
  const label = document.createElement("span"); label.className = "tag";
  const stamp = item.wall ? new Date(item.wall * 1000) : null;
  label.textContent = `${stamp ? `${pad(stamp.getHours())}:${pad(stamp.getMinutes())}:${pad(stamp.getSeconds())} · ` : ""}${item.kind || "解说"}`;
  entry.append(label, document.createTextNode(item.text));
  return entry;
}

function syncThoughtEntries(el, items, reset) {
  if (reset) el.replaceChildren();
  const existing = new Map(Array.from(el.children, entry => [entry.dataset.id, entry]));
  items.forEach((item, index) => {
    const id = String(item.id);
    let entry = existing.get(id);
    if (!entry) entry = thoughtEntry(item);
    else if (entry.dataset.signature !== JSON.stringify(item)) {
      const updated = thoughtEntry(item);
      entry.replaceWith(updated); entry = updated;
    }
    existing.delete(id);
    if (el.children[index] !== entry) el.insertBefore(entry, el.children[index] || null);
  });
  for (const entry of existing.values()) entry.remove();
}

function setText(el, value) {
  const text = String(value);
  if (el.textContent !== text) el.textContent = text;
}

// 消息区只显示历史接口返回的消息，不拼接 metrics 中的实时片段。
let lastHistoryItems = [];
let showingTools = false, toolsInflight = false, toolsRun = null, toolsEpoch = 0;
const TOOL_STATES = {running:'执行中', returned:'已返回', failed:'失败', unknown:'结果未确认', interrupted:'未收到结果·轮次已结束'};
function selectHistory(tools) {
  if (OBS_SURFACE) return;
  toolsEpoch++;
  showingTools = tools;
  $('thought').classList.toggle('hidden', tools);
  $('toolActivity').classList.toggle('hidden', !tools);
  $('showMessages').setAttribute('aria-selected', String(!tools));
  $('showTools').setAttribute('aria-selected', String(tools));
  if (tools) pollTools();
}
$('showMessages').onclick = () => selectHistory(false);
$('showTools').onclick = () => selectHistory(true);

function toolEntry(item, opened) {
  const entry = document.createElement('details');
  entry.className='tool-entry'; entry.dataset.id=item.id; entry.dataset.status=item.status;
  entry.dataset.signature=JSON.stringify(item); entry.open=opened;
  const summary=document.createElement('summary'), meta=document.createElement('span');
  meta.className='tool-meta';
  const stamp=item.wall ? new Date(item.wall*1000) : null;
  const clock=stamp ? `${pad(stamp.getHours())}:${pad(stamp.getMinutes())}:${pad(stamp.getSeconds())} · ` : '';
  const duration=Number.isFinite(item.duration_s) ? ` · ${item.duration_s.toFixed(2)}秒` : '';
  meta.textContent=clock+(TOOL_STATES[item.status] || '未知')+duration;
  summary.append(meta,document.createElement('br'),document.createTextNode(item.text || item.tool || '工具'));
  const body=document.createElement('pre');
  body.textContent='请求参数\n'+(item.parameters===null ? '尚无可核实的参数记录' : JSON.stringify(item.parameters,null,2))+
    '\n\n返回摘要（原生工具结果，非总上下文）\n'+(item.result===null ? '尚无可核实的返回结果' : JSON.stringify(item.result,null,2))+
    '\n应用图像附件：'+(item.attached_images==null ? '未确认数量' : item.attached_images+' 张');
  entry.append(summary,body); return entry;
}
async function pollTools() {
  if (OBS_SURFACE || !showingTools || toolsInflight) return;
  toolsInflight=true;
  const epoch=toolsEpoch, expectedRun=controlData?.run || historyRun;
  try {
    if(!expectedRun) throw new Error('等待当前会话身份…');
    if(toolsRun && toolsRun!==expectedRun) { $('toolRows').replaceChildren(); toolsRun=null; }
    let response=await fetch(STATE_URL.replace(/\/state$/, '/tools'),{cache:'no-store'});
    if(!response.ok) response=await fetch('http://127.0.0.1:47792/hud/tools',{cache:'no-store'});
    if(!response.ok) throw new Error('工具记录接口尚未就绪');
    const data=await response.json(), box=$('toolRows'), scroll=$('toolActivity');
    if(!showingTools || epoch!==toolsEpoch || expectedRun!==(controlData?.run || historyRun)) return;
    if(data.run!==expectedRun) { box.replaceChildren(); toolsRun=null; throw new Error('工具记录属于另一运行，等待当前会话接口就绪。'); }
    const reset=toolsRun!==data.run, follow=reset || scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<12;
    if(reset) box.replaceChildren();
    toolsRun=data.run;
    const existing=new Map(Array.from(box.children,e=>[e.dataset.id,e]));
    (data.items || []).forEach((item,index)=>{
      let entry=existing.get(String(item.id));
      if(!entry) entry=toolEntry(item,false);
      else if(entry.dataset.signature!==JSON.stringify(item)){
        const replacement=toolEntry(item,entry.open);entry.replaceWith(replacement);entry=replacement;
      }
      existing.delete(String(item.id));
      if(box.children[index]!==entry) box.insertBefore(entry,box.children[index] || null);
    });
    for(const entry of existing.values()) entry.remove();
    $('toolNotice').textContent=[data.loading?'正在载入历史详情…':'点击记录展开参数和结果',data.warning,
      data.skipped_lines?`${data.skipped_lines} 行详情超限或无效，未解析`:'',data.scope].filter(Boolean).join(' · ');
    if(follow) scroll.scrollTop=scroll.scrollHeight;
  } catch(error) { $('toolNotice').textContent=error.message || '工具记录暂不可用'; }
  finally { toolsInflight=false; }
}
function applyThoughts(first) {
  const el = $("thought");
  const oldTop = el.scrollTop;
  const visibleEntry = Array.from(el.children).find(entry => entry.offsetTop - el.offsetTop + entry.offsetHeight > oldTop);
  const anchor = visibleEntry && visibleEntry.dataset.id;
  const anchorDelta = visibleEntry ? oldTop - (visibleEntry.offsetTop - el.offsetTop) : 0;
  const wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 3;
  syncThoughtEntries(el, lastHistoryItems, first);
  if (first) {
    el.scrollTop = Math.max(0, el.scrollHeight - el.clientHeight);
    followHistory = true;
  } else if (followHistory || wasAtBottom) {
    el.scrollTop = el.scrollHeight;
    followHistory = true;
  } else {
    const retained = Array.from(el.children).find(entry => entry.dataset.id === anchor);
    el.scrollTop = retained ? retained.offsetTop - el.offsetTop + anchorDelta : oldTop;
  }
}

async function pollHistory() {
  if (historyInflight) return;
  historyInflight = true;
  try {
    const url = historyEndpoint || (config && config.history_url) || STATE_URL.replace(/\/state$/, "/history");
    let response = await fetch(url, {cache: "no-store"});
    // 正在游玩的旧主控不必重启；可暂用独立 HUD 服务提供新接口。
    if (!response.ok) {
      historyEndpoint = "http://127.0.0.1:47792/hud/history";
      response = await fetch(historyEndpoint, {cache: "no-store"});
    }
    if (!response.ok) return;
    const data = await response.json();
    const items = (data.items || []).slice(-12);
    const signature = JSON.stringify([data.run, items]);
    if (signature === historySignature) return;
    historySignature = signature;
    const first = !historyReady || historyRun !== data.run;
    lastHistoryItems = items;
    applyThoughts(first);
    historyReady = items.length > 0; historyRun = data.run;
  } catch (error) { /* 历史服务短暂离线时保留已有内容 */ }
  finally { historyInflight = false; }
}

$("thought").addEventListener("scroll", () => {
  const el = $("thought"); followHistory = el.scrollHeight - el.scrollTop - el.clientHeight < 10;
}, {passive: true});
new ResizeObserver(() => {
  const el = $("thought");
  if (followHistory) el.scrollTop = el.scrollHeight;
}).observe($("thought"));

function render() {
  const card = $("card");
  if (!state) { card.classList.add("hidden"); return; }
  // HUD 以 MOD 形式画在游戏画面里（--hud-mod）时，OBS 浏览器源不再显示这一份（录像里只有游戏画面里的那份）
  if (OBS_SURFACE && state.hud_mod) { card.classList.add("hidden"); return; }
  card.classList.remove("hidden");
  const m = state, c = (config && config.colors) || {};
  const source = telemetryLabel(m);
  $("chatSourceBox").classList.toggle("hidden", !source);
  $("chatCallsBox").classList.toggle("hidden", !source);
  setText($("chatSource"), source);
  setText($("toolCountLabel"), "工具调用");
  setText($("chatCalls"), m.tool_calls == null ? '—' : `${since(m, "tool_calls")} 次`);
  const now = Date.now() / 1000 + offset;
  // 规划回放与智能体的思考同时进行（回放画上一轮，智能体在想下一轮）：回放期间状态栏显示"规划回放"
  const replaying = !!m.replaying || m.status === "replaying";
  const [text, kind, breathe] = replaying ? STATUS.replaying : (STATUS[m.status] || [m.status, "idle", false]);
  const playing = m.started_wall > 0;
  // 思考与工具时间从知识库读完就开始走（准备阶段的其余部分：写笔记、写程序、规划第一个房间）
  const counting = playing || (m.kb_progress != null && m.kb_progress >= 1);
  const ended = m.status === "done" || m.status === "stopped";

  setText($("name"), displayName(m));
  let statusText = text;
  if (m.status === "studying") statusText = `${text} ${Math.round((m.kb_progress || 0) * 100)}%`;
  if (m.status === "quota_wait" && m.quota_wait_until) {
    const d = new Date(m.quota_wait_until * 1000);
    statusText = `${text}（${pad(d.getHours())}:${pad(d.getMinutes())} 恢复）`;
  }
  setText($("status"), statusText);
  const dot = $("dot");
  dot.style.background = c[kind] || "#8F9AB3";
  dot.classList.toggle("breathe", breathe);

  const chapters = (config && config.chapters) || {};

    const current=selected.id===controlData?.model ? state?.effort : null;
    $('sessionEffort').value=selected.efforts.includes(old)?old:selected.efforts.includes(current)?current:selected.default_effort;
    $('sessionModel').title=selected.description;
  }
}
async function loadModelChoices(refresh=false) {
  const requestId=++modelRequest;
  modelsLoading=true; modelCatalogError='';
  await pollControl();
  if(!state) await poll(); // 首次加载先取得当前推理强度，避免快速缓存响应把既有选择重置。
  try {
    const response=await fetch(MODELS_URL+'?'+new URLSearchParams({...chosenRuntime(),refresh:refresh?'1':'0'}),{cache:'no-store'});
    const data=await response.json();
    if(requestId!==modelRequest)return;
    if(!response.ok || !data.models?.length) throw Error(data.error || '没有可选模型，请刷新重试。');
    const previous=$('sessionModel').value;
    modelCatalog=data;
    $('sessionModel').replaceChildren(...data.models.map(item=>{
      const option=document.createElement('option');option.value=item.id;option.textContent=item.label;return option;
    }));
    const ids=data.models.map(item=>item.id);
    $('sessionModel').value=ids.includes(previous)?previous:ids.includes(controlData?.model)?controlData.model:data.default_model;
    updateModelEfforts();
  } catch(error){if(requestId===modelRequest)modelCatalogError=error.message;}
  finally {if(requestId===modelRequest){modelsLoading=false;$('modelChoiceStatus').textContent=modelCatalogError || (modelCatalog.source==='provider_config'?'模型列表来自本机提供方配置。':'');await pollControl();}}
}
$('sessionRuntime').onchange=()=>{modelCatalog={models:[]};$('sessionModel').replaceChildren();$('sessionEffort').replaceChildren();loadModelChoices();};
$('sessionModel').onchange=()=>{updateModelEfforts();pollControl();};
$('sessionModelRefresh').onclick=()=>loadModelChoices(true);
let controlPollRequested=0, controlPollApplied=0;
async function pollControl() {
  if (OBS_SURFACE) return;
  const request=++controlPollRequested;
  try {
    const response = await fetch(CONTROL_URL, {cache:'no-store'});
    if (!response.ok) throw Error('主控暂未连接');
    const snapshot=await response.json();
    if(request<controlPollApplied) return;
    controlPollApplied=request;controlData=snapshot;
    const runtimeSelect=$('sessionRuntime'), runtimeOptions=controlData.runtimes || [{id:'codex:codex',label:'Codex'}];
    runtimeSelect.hidden=!controlData.runtimes;
    const runtimeSignature=JSON.stringify(runtimeOptions);
    if(runtimeSelect.dataset.options!==runtimeSignature){
      const previous=runtimeSelect.dataset.options?runtimeSelect.value:controlData.runtime;
      runtimeSelect.dataset.options=runtimeSignature;
      runtimeSelect.replaceChildren(...runtimeOptions.map(item=>{const o=document.createElement('option');o.value=item.id;o.textContent=item.label;return o;}));
      if(runtimeOptions.some(item=>item.id===previous))runtimeSelect.value=previous;
    }
    const c = controlData.control;
    renderGoal(c);
    renderSimulation(c);
    renderActLimit(c);
    const sessions = controlData.sessions || [];
    const signature = JSON.stringify([sessions,controlData.selected_session]);
    if (signature !== sessionSignature && !switchingSession) {
      sessionSignature = signature;
      $('sessionSelect').replaceChildren(...sessions.map(session => {
        const option = document.createElement('option'); option.value=session.id; option.textContent=session.label;
        option.selected=session.id === controlData.selected_session; return option;
      }));
    }
    $('sessionSelect').disabled = switchingSession || !controlData.can_wake || controlData.waking || c.phase === 'chatting';
    const pending = (c.actions || []).find(a => a.kind !== 'message' && a.status === 'queued');
    const last = (c.messages || []).filter(m => m.role === 'user').at(-1);
    const delivery = last ? ({queued:'提示等待发送',waiting:'提示等待提交',submitted:'提示已提交给 agent',error:'提示发送失败'}[last.status] || '') : '';
    $('controlStatus').textContent = !c.connected ? (controlData.waking || wakingAgent ? '正在唤起 agent…' : controlData.can_wake ? '试玩已结束，可唤起 agent 聊天' : '主控未连接') :
      c.phase === 'pausing' || pending?.kind === 'pause' ? '暂停中，等待当前动作结束…' :
      (c.chat_only ? (controlData.ready_to_play ? '准备完成 · 可聊天' : '试玩已结束 · 可聊天') : c.paused ? '已暂停，仍可发送提示' : '正在试玩') + (delivery ? ' · ' + delivery : '');
    const primary=primaryControlView(controlData,{wakingAgent,lifecycleBusy,switchingSession});
    $('togglePlay').textContent=primary.label;
    $('togglePlay').disabled=primary.disabled;
    $('agentSend').disabled = !c.connected || sendingMessage;
    $('toggleFast').title = c.connected && c.fast_pending ? '等待当前模型轮次结束后切换，当前动作不会被中断' : '设置下次模型请求是否使用 Fast';
    $('toggleFast').textContent = `Fast：${c.fast == null ? '—' : c.fast ? '开' : '关'}${c.connected && c.fast_pending ? '（待换轮）' : ''}`;
    $('toggleFast').setAttribute('aria-pressed', String(!!c.fast));
    $('toggleFast').hidden = !c.fast_control;
    $('toggleFast').disabled = !c.connected || !c.fast_control || (c.actions || []).some(a => a.kind === 'fast' && a.status === 'queued');
    if (switchingSession) {
      $('controlStatus').textContent = '正在交接会话…';
      for (const id of ['togglePlay','toggleFast','agentSend']) $(id).disabled = true;
    }
    const operation = controlData.operation || {};
    if(saveSelectionRun!==controlData.run){
      saveSelectionRun=controlData.run;$('sessionSave').value='';$('sessionSaveName').value='';updateSaveChoice();
    }
    const busy = lifecycleBusy || ['preparing','connecting','starting','naming'].includes(operation.status);
    syncLiveEffort(controlData,busy || switchingSession);
    const pendingStory=(c.actions || []).find(a=>a.kind==='cutscene_mode' && ['queued','waiting'].includes(a.status));
    const pendingPermissions=(c.actions || []).some(a=>['action_permissions','chapter_reset','detour'].includes(a.kind) && ['queued','waiting'].includes(a.status));
    for (const [key,id] of [['restart_chapter','RestartChapter'],['return_to_map','ReturnToMap'],['save_quit','SaveQuit']]) {
      const input=$('permission'+id);
      if(document.activeElement!==input) input.value=(c.action_permissions?.[key] ?? c.allow_chapter_reset) ? 'allow' : 'deny';
      // 计划外地图开着时返回地图必须允许：先关计划外地图才能单独禁止它
      input.disabled=!c.connected || !c.chapter_reset_control || c.action_policy_supported !== true || busy || pendingPermissions || (key==='return_to_map' && c.allow_detour===true);
    }
    const detourInput=$('permissionDetour');   // 计划外地图：与三项权限同样在动作之间生效；开启需要桥接的地图集合门禁
    if(document.activeElement!==detourInput) detourInput.value=c.allow_detour ? 'allow' : 'deny';
    detourInput.disabled=!c.connected || !c.detour_control || (!c.allow_detour && c.detour_supported === false) || busy || pendingPermissions;
    $('cutsceneMode').value=pendingStory?.text || c.cutscene_mode || 'auto';
    $('cutsceneMode').disabled=!c.connected || !c.cutscene_control || busy || !!pendingStory;
    const manageable = controlData.session_management && (controlData.can_create_session || controlData.can_wake) && c.phase !== 'chatting' && !switchingSession && !controlData.waking && !busy;
    const selectedModel=modelCatalog.models.find(item=>item.id===$('sessionModel').value);
    $('sessionNew').disabled = !manageable || modelsLoading || !!modelCatalogError || !selectedModel?.efforts.includes($('sessionEffort').value);
    $('sessionDisconnect').disabled = !manageable || !c.connected;
    const save=selectedSave();
    $('sessionPlay').disabled = !manageable || !controlData.ready_to_play || savesLoading || !!savesError || !save || (!save.create_save && !save.save);
    for (const id of ['sessionName','sessionModel','sessionEffort','sessionChapter']) $(id).disabled=busy;
    for(const id of ['sessionSave','sessionSaveName'])$(id).disabled=busy || !manageable;
    syncRecordingOptions(controlData, busy || switchingSession || !!controlData.waking);
    $('sessionScope').disabled=busy || !manageable;
    $('sessionChapter').disabled=busy || $('sessionScope').value==='visited';
    $('sessionCompletion').disabled=busy || !manageable;
    $('sessionSimAssist').disabled=busy || !manageable || !controlData.sim_available;
    if(!controlData.sim_available)$('sessionSimAssist').checked=false;
    $('simAvailability').textContent=controlData.sim_available ? '' : '（未安装，可关闭此项直接试玩）';
    $('sessionModel').disabled=busy || modelsLoading || !modelCatalog.models.length;
    $('sessionEffort').disabled=busy || modelsLoading || !selectedModel;
    $('sessionModelRefresh').disabled=busy || modelsLoading;
    $('sessionOperation').textContent = lifecycleError || (operation.status==='error' ? operation.error :
      busy ? ({preparing:'正在准备入门资料…',connecting:'正在接入会话…',starting:'正在进入章节…',naming:'会话正在取名…'}[operation.status] || '正在交接会话…') : '');
    $('sessionOperation').hidden=!$('sessionOperation').textContent;
    if (busy) {
      $('controlStatus').textContent=$('sessionOperation').textContent;
      for (const id of ['sessionSelect','togglePlay','toggleFast','agentSend']) $(id).disabled=true;
    }
  } catch (error) {
    if(request<controlPollApplied) return;
    $('controlStatus').textContent = error.message;
    $('togglePlay').textContent = '未连接';
    $('togglePlay').disabled = $('agentSend').disabled = true;
    $('toggleFast').disabled = true;
    $('liveEffort').disabled = true;
    $('sessionSelect').disabled = true;
    for (const id of ['sessionNew','sessionDisconnect','sessionPlay','recordingMode','freezeChapterSelect','freezeFileSelect','freezeMainMenu']) $(id).disabled=true;
  }
}
let recordingSelectionRun=null;
function readRecordingOptions() {
  return {recording_mode:$('recordingMode').value, freeze_chapter_select:$('freezeChapterSelect').checked,
    freeze_file_select:$('freezeFileSelect').checked, freeze_main_menu:$('freezeMainMenu').checked};
}
function syncRecordingOptions(data, busy=false) {
  const live=!!data.control?.connected && !data.control?.chat_only;
  if(recordingSelectionRun!==data.run || live) {
    const values=data.recording_options || {recording_mode:'chapter',freeze_chapter_select:true,freeze_file_select:false,freeze_main_menu:false};
    $('recordingMode').value=values.recording_mode;
    for(const [key,id] of [['freeze_chapter_select','freezeChapterSelect'],['freeze_file_select','freezeFileSelect'],['freeze_main_menu','freezeMainMenu']])$(id).checked=values[key];
    recordingSelectionRun=data.run;
  }
  for(const id of ['recordingMode','freezeChapterSelect','freezeFileSelect','freezeMainMenu'])$(id).disabled=busy || live || !data.session_management;
  $('recordingStatus').textContent=live ? '当前试玩配置；停止后才能为新试玩调整，不能直接切换正在采集的录像。' :
    '点击会话管理中的“开始试玩”时应用；旧运行续跑沿用原设置。';
}
let lifecycleBusy=false, lifecycleError='';
async function sessionAction(kind, options) {
  lifecycleBusy=true; lifecycleError='';
  await pollControl();
  const ok=await sendControl(kind, options ? JSON.stringify(options) : '');
  if(!ok) lifecycleError=controlError || '会话操作失败';
  if(ok && kind==='new_session') $('sessionName').value='';
  lifecycleBusy=false;
  await pollControl();
}
$('sessionNew').onclick=()=>sessionAction('new_session',{...chosenRuntime(),name:$('sessionName').value,model:$('sessionModel').value,effort:$('sessionEffort').value});
$('sessionDisconnect').onclick=()=>sessionAction('disconnect');
$('sessionScope').onchange=()=>{ $('sessionCompletion').value=$('sessionScope').value==='visited'?'continue':'stop'; $('sessionChapter').disabled=$('sessionScope').value==='visited'; };
$('sessionPlay').onclick=()=>{
  const raw=$('sessionChapter').value.trim(), chapter=Number(raw);
  if(!raw || !Number.isInteger(chapter) || chapter<0 || chapter>10){
    lifecycleError='请填写0～10的A面章节编号（0为序章）。'; pollControl(); return;
  }
  const choice=selectedSave();
  if(!choice || (!choice.create_save && !choice.save)){lifecycleError='请显式选择存档。';pollControl();return;}
  if(choice.create_save && chapter!==0){lifecycleError='新存档须从序章（0）开始。';pollControl();return;}
  sessionAction('play_session',{chapter,...choice,scope:$('sessionScope').value,completion_policy:$('sessionCompletion').value,sim_assist:$('sessionSimAssist').checked,...readRecordingOptions()});
};
async function sendControl(kind, text='', onAccepted=null) {
  if (!controlData) return false;
  controlError = '';
  try {
    const response = await fetch(CONTROL_URL, {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({run:controlData.run,kind,text})});
    const result = await response.json();
    if (!response.ok) throw Error(result.error || '提交失败');
    if(onAccepted) onAccepted(result);
    await pollControl(); return true;
  } catch (error) { controlError=error.message; $('controlStatus').textContent = error.message; return false; }
}
$('togglePlay').onclick = async () => {
  const primary=primaryControlView(controlData,{wakingAgent,lifecycleBusy,switchingSession});
  if(primary.disabled || !primary.action) return;
  $('togglePlay').disabled = true;
  if (primary.action==='wake') {
    wakingAgent = true;
    await sendControl('wake');
    wakingAgent = false;
    await pollControl();
  } else await sendControl(primary.action);
};
$('toggleFast').onclick = async () => {
  $('toggleFast').disabled = true;
  await sendControl('fast', controlData?.control.fast ? 'off' : 'on');
};
$('cutsceneMode').onchange=async()=>{await sendControl('cutscene_mode',$('cutsceneMode').value);};
for (const [key,id] of [['restart_chapter','RestartChapter'],['return_to_map','ReturnToMap'],['save_quit','SaveQuit']]) {
  $('permission'+id).onchange=async()=>sendControl('action_permissions',JSON.stringify({[key]:$('permission'+id).value==='allow'}));
}
$('permissionDetour').onchange=async()=>sendControl('detour',$('permissionDetour').value==='allow' ? 'on' : 'off');
$('simApply').onclick=saveSimulation;
$('simReset').onclick=()=>{simEdited.clear();$('simBalance').value='';simError='';simApplied=false;renderSimulation(controlData.control);};
$('actLimitFrames').oninput=()=>{actLimitEdited=true;actLimitApplied=false;};
$('actLimitFrames').onkeydown=event=>{   // 帧数框里按 Enter 只应用帧数（照常校验），不触发聊天发送
  if(event.key==='Enter' && !event.isComposing){event.preventDefault();saveActLimit();}
};
$('actLimitSave').onclick=saveActLimit;
$('actLimitReset').onclick=()=>{actLimitEdited=false;actLimitError='';actLimitApplied=false;renderActLimit(controlData.control);};
$('liveEffort').onchange=async()=>{
  const level=$('liveEffort').value;
  changingEffort=true;$('liveEffort').disabled=true;
  await sendControl('effort',level);
  changingEffort=false;await pollControl();
};
$('goalText').oninput=editGoal;
$('goalMatch').onchange=editGoal;
$('goalAdd').onclick=()=>{if($('goalConditions').children.length<12){$('goalConditions').append(goalRow());editGoal();}};
async function saveGoal(kind) {
  goalError='';
  if (!controlData?.control) {
    // 主控还没连上：没有可提交的运行，提示而不是静默失败
    $('goalDraftStatus').textContent='主控尚未连接，暂时不能修改目标；连接后再点击。';
    $('goalDraftStatus').hidden=false;
    return;
  }
  if (kind==='goal' && Array.from($('goalConditions').children).some(row => GOAL_NUMERIC.has(row.children[0].value) && !row.children[2].value.trim())) {
    goalError='请填写数值条件。'; renderGoal(controlData.control); return;
  }
  const conditions=Array.from($('goalConditions').children).map(row=>{
    const [field,op,value]=row.children;
    return {field:field.value,op:op.value,value:field.value==='map_complete'?true:GOAL_NUMERIC.has(field.value)?Number(value.value):value.value.trim()};
  });
  const run=controlData.run, revision=controlData.control.goal?.revision||0;
  savingGoal=true;renderGoal(controlData.control);
  const ok=await sendControl(kind,kind==='goal'?JSON.stringify({text:$('goalText').value,conditions,match:$('goalMatch').value}):'',result=>{
    if(controlData.run===run) goalPending={id:result.id,kind,revision,wall:Date.now()};
  });
  savingGoal=false;
  if(controlData.run===run && !ok) goalError=controlError || '未提交成功，请重试。';
  if(controlData) renderGoal(controlData.control);
  await pollControl();
}
$('goalSave').onclick=()=>saveGoal('goal');
$('goalClear').onclick=()=>saveGoal('goal_clear');
$('goalStop').onclick=()=>saveGoal('stop');
$('buttonPromptsOpen').onclick=()=>window.open(new URL('/console#prompts',CONTROL_URL).href,'_blank','noopener');
$('sessionSelect').onchange = async () => {
  switchingSession = true; $('sessionSelect').disabled = true;
  const target = $('sessionSelect').value;
  const success = await sendControl('switch', target);
  if (success) $('agentInput').value = '';
  switchingSession = false; sessionSignature = '';
  await pollControl();
};
$('agentControls').onsubmit = async event => {
  event.preventDefault(); const text = $('agentInput').value.trim();
  if (!text || sendingMessage || $('agentSend').disabled) return;
  sendingMessage = true; $('agentSend').disabled = true;
  if (await sendControl('message', text)) $('agentInput').value = '';
  sendingMessage = false; await pollControl();
};
$('agentInput').onkeydown = event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault(); $('agentControls').requestSubmit();
  }
};
pollControl(); setInterval(pollControl, 750);
loadModelChoices();
loadSaveChoices();
setInterval(poll, Number(params.get("poll") || 100));
pollHistory(); setInterval(pollHistory, 750);
if (!OBS_SURFACE) setInterval(pollTools, 1000);
(function loop() { render(); requestAnimationFrame(loop); })();
</script>
