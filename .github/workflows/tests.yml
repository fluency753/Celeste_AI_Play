name: Tests
# Python 全量回归（Windows 与 Linux）、静态检查，以及不需要游戏文件的端口检查。
# 组件构建在 release-components.yml；这里不构建、不发布。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            python: '3.14'
          - os: ubuntu-24.04
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt pyflakes
      # 页面测试（Playwright + Chromium）与用真实 ffmpeg 的录制测试在没有这些工具时自行跳过；Linux 上装上，多覆盖一些。
      - name: Browser and ffmpeg for the page and recording tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Static check
        run: python -X utf8 tools/static_check.py
      - name: Regression
        # 这里的机器比本机慢，用真实时间做判断的用例和别的进程同时跑时偶尔失败：失败的模块单独重跑一次，
        # 通过则算通过，并在最后一行列为不稳定。本机运行不带这个参数。
        run: python -X utf8 tools/run_tests.py --rerun-failed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-${{ matrix.os }}
          path: local/test-results/latest
          if-no-files-found: ignore
  ports:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Connection token and first-line checks
        run: dotnet run --project calibration/ipc_auth
